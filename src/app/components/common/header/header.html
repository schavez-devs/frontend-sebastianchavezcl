<header class="site-header">
  <nav class="container nav" aria-label="Navegación principal">
    <a class="brand" routerLink="/" (click)="menuOpen = false">Full Stack <span>Developer</span></a>
    <button
      class="menu-toggle"
      type="button"
      (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="main-menu"
      aria-label="Abrir o cerrar menú"
    >
      ☰
    </button>
    <div id="main-menu" class="nav-links" [class.open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
        >Inicio</a
      >
      <a routerLink="/portafolio" routerLinkActive="active" (click)="menuOpen = false"
        >Portafolio</a
      >
      <a routerLink="/mis-apps" routerLinkActive="active" (click)="menuOpen = false">Mis apps</a>
      <a routerLink="/certificaciones" routerLinkActive="active" (click)="menuOpen = false"
        >Formación</a
      >
      <a routerLink="/contacto" routerLinkActive="active" (click)="menuOpen = false">Contacto</a>
    </div>
  </nav>
</header>
